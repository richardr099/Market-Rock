name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: pip install -e .[fast,test]
      - name: C# compile check (against NT8 stubs)
        run: dotnet build tools/nt8-compile-check -nologo
      - name: Tests (incl. Python <-> C# parity)
        run: pytest -q
