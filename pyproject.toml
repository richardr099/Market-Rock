[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketrock"
version = "0.1.0"
description = "Semi-autonomous order-flow strategy research + NinjaTrader 8 execution bridge"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
fast = ["numba>=0.59"]
test = ["pytest>=8"]

[project.scripts]
marketrock = "marketrock.cli:main"

[tool.setuptools]
packages = ["marketrock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
